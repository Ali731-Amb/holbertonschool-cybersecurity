table inet filter { #Table for IPv4 + IPv6 filtre 
        chain input { #filtre sur input 
                type filter hook input priority 0; policy drop; #policicy bloqué par defaut 
				ct state established,related accept #autorise les reponses aux connexions que l'on connais 
				iifname "lo" accept #autorise le serveur a parler a lui même 
				tcp dport 22 accept #autorise SHH (port 22) 
				ip protocol icmp accept # Allow ping (ipV4) 
				ip6 nexthdr icmpv6 accept #allow ICMPv6 besoin oour l'ipv6 
        }
        chain output {#filtre sur output
			type filter hook output priority 0; policy accept; #policicy accepter par defaut
		}
		chain forward {#filtre sur forward (traversée l'immeuble) 
			type filter hook forward priority 0; policy drop; #policicy bloqué par defaut
		}
}
